<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#19181d" />
      <stop offset="60%" stop-color="#0e0d10" />
      <stop offset="100%" stop-color="#050507" />
    </radialGradient>
    <linearGradient id="qhGoldMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2" />
      <stop offset="25%" stop-color="#f5cf58" />
      <stop offset="65%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8f6b10" />
    </linearGradient>
    <linearGradient id="qhGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#8a6712" />
      <stop offset="100%" stop-color="#3d2c05" />
    </linearGradient>
    <linearGradient id="qhPipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#aa7c11" />
      <stop offset="40%" stop-color="#ffd868" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#573f08" />
    </linearGradient>
    <radialGradient id="qhCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5cf58" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070709" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="qhHexFill" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#222026" />
      <stop offset="60%" stop-color="#121115" />
      <stop offset="100%" stop-color="#08080a" />
    </radialGradient>
    <filter id="qhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#d4af37" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- App Icon Rounded Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="112" fill="none" stroke="url(#qhGoldMain)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Quantum Hive Emblem -->
  <g transform="translate(6, 6)" filter="url(#qhGlow)">
    <!-- 1. Metallic Connecting Pipes -->
    <line x1="250" y1="180" x2="250" y2="120" stroke="url(#qhPipeGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="250" cy="180" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />
    <circle cx="250" cy="120" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />

    <line x1="315" y1="210" x2="385" y2="175" stroke="url(#qhPipeGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="315" cy="210" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />
    <circle cx="385" cy="175" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />

    <line x1="315" y1="290" x2="365" y2="355" stroke="url(#qhPipeGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="315" cy="290" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />
    <circle cx="365" cy="355" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />

    <line x1="185" y1="290" x2="135" y2="355" stroke="url(#qhPipeGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="185" cy="290" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />
    <circle cx="135" cy="355" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />

    <line x1="185" y1="210" x2="115" y2="175" stroke="url(#qhPipeGrad)" stroke-width="11" stroke-linecap="round" />
    <circle cx="185" cy="210" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />
    <circle cx="115" cy="175" r="7" fill="url(#qhGoldMain)" stroke="#1a181d" stroke-width="2" />

    <!-- 2. Central Hexagon -->
    <polygon points="250,150 336,200 336,300 250,350 164,300 164,200"
             fill="url(#qhHexFill)" stroke="url(#qhGoldMain)" stroke-width="10" stroke-linejoin="round" />
    <polygon points="250,162 324,205 324,295 250,338 176,295 176,205"
             fill="#0c0c0f" stroke="url(#qhGoldDark)" stroke-width="3.5" stroke-linejoin="round" />
    <circle cx="250" cy="250" r="70" fill="url(#qhCenterGlow)" />

    <!-- Central Constellation Lines -->
    <g stroke="#d4af37" stroke-width="1.2" opacity="0.75">
      <line x1="250" y1="180" x2="215" y2="210" />
      <line x1="250" y1="180" x2="285" y2="210" />
      <line x1="215" y1="210" x2="285" y2="210" />
      <line x1="215" y1="210" x2="195" y2="250" />
      <line x1="285" y1="210" x2="305" y2="250" />
      <line x1="195" y1="250" x2="215" y2="290" />
      <line x1="305" y1="250" x2="285" y2="290" />
      <line x1="215" y1="290" x2="285" y2="290" />
      <line x1="215" y1="290" x2="250" y2="320" />
      <line x1="285" y1="290" x2="250" y2="320" />
    </g>

    <!-- Constellation Nodes -->
    <g fill="#f5cf58">
      <circle cx="250" cy="180" r="3.5" />
      <circle cx="215" cy="210" r="3" />
      <circle cx="285" cy="210" r="3" />
      <circle cx="195" cy="250" r="3" />
      <circle cx="305" cy="250" r="3" />
      <circle cx="215" cy="290" r="3" />
      <circle cx="285" cy="290" r="3" />
      <circle cx="250" cy="320" r="3.5" />
    </g>

    <!-- 3D Isometric Center Cube -->
    <g transform="translate(250, 250)">
      <polygon points="0,-22 19,-11 19,11 0,22 -19,11 -19,-11"
               fill="#17161c" stroke="url(#qhGoldMain)" stroke-width="3.5" stroke-linejoin="round" />
      <line x1="0" y1="0" x2="0" y2="22" stroke="url(#qhGoldMain)" stroke-width="2.5" />
      <line x1="0" y1="0" x2="-19" y2="-11" stroke="url(#qhGoldMain)" stroke-width="2.5" />
      <line x1="0" y1="0" x2="19" y2="-11" stroke="url(#qhGoldMain)" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" />
