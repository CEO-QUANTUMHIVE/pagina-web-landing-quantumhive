    <!-- Satellite 1: Top Atom -->
    <g transform="translate(250, 75)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
               fill="url(#qhHexFill)" stroke="url(#qhGoldMain)" stroke-width="6" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="6" fill="url(#qhGoldMain)" />
      <ellipse cx="0" cy="0" rx="22" ry="7" stroke="url(#qhGoldMain)" stroke-width="2" fill="none" />
      <ellipse cx="0" cy="0" rx="22" ry="7" stroke="url(#qhGoldMain)" stroke-width="2" fill="none" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="22" ry="7" stroke="url(#qhGoldMain)" stroke-width="2" fill="none" transform="rotate(-60)" />
      <circle cx="16" cy="0" r="2.5" fill="#fff" />
      <circle cx="-8" cy="14" r="2.5" fill="#fff" />
      <circle cx="-8" cy="-14" r="2.5" fill="#fff" />
    </g>

    <!-- Satellite 2: Top-Right AI Brain -->
    <g transform="translate(415, 195)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
               fill="url(#qhHexFill)" stroke="url(#qhGoldMain)" stroke-width="6" stroke-linejoin="round" />
      <path d="M -16,18 C -16,14 -12,12 -12,6 C -12,2 -16,-2 -15,-12 C -14,-20 -6,-24 4,-24 C 14,-24 20,-16 20,-6 C 20,4 14,14 6,18 L -16,18 Z"
            fill="none" stroke="url(#qhGoldMain)" stroke-width="2" stroke-linecap="round" />
      <line x1="4" y1="12" x2="4" y2="-4" stroke="#f5cf58" stroke-width="2" />
      <line x1="4" y1="-4" x2="-4" y2="-12" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="4" y1="-4" x2="12" y2="-12" stroke="#f5cf58" stroke-width="1.5" />
      <circle cx="4" cy="-4" r="2.5" fill="#fff" />
      <circle cx="-4" cy="-12" r="2" fill="#f5cf58" />
      <circle cx="12" cy="-12" r="2" fill="#f5cf58" />
