    <g transform="translate(370, 395)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
               fill="url(#qhHexFill)" stroke="url(#qhGoldMain)" stroke-width="6" stroke-linejoin="round" />
      <circle cx="0" cy="0" r="3.5" fill="#f5cf58" />
      <line x1="0" y1="0" x2="0" y2="-18" stroke="url(#qhGoldMain)" stroke-width="1.5" />
      <line x1="0" y1="0" x2="15" y2="-9" stroke="url(#qhGoldMain)" stroke-width="1.5" />
      <line x1="0" y1="0" x2="15" y2="9" stroke="url(#qhGoldMain)" stroke-width="1.5" />
      <line x1="0" y1="0" x2="0" y2="18" stroke="url(#qhGoldMain)" stroke-width="1.5" />
      <line x1="0" y1="0" x2="-15" y2="9" stroke="url(#qhGoldMain)" stroke-width="1.5" />
      <line x1="0" y1="0" x2="-15" y2="-9" stroke="url(#qhGoldMain)" stroke-width="1.5" />
      <circle cx="0" cy="-18" r="3" fill="#f5cf58" />
      <circle cx="15" cy="-9" r="3" fill="#f5cf58" />
      <circle cx="15" cy="9" r="3" fill="#f5cf58" />
      <circle cx="0" cy="18" r="3" fill="#f5cf58" />
      <circle cx="-15" cy="9" r="3" fill="#f5cf58" />
      <circle cx="-15" cy="-9" r="3" fill="#f5cf58" />
    </g>

    <!-- Satellite 4: Bottom-Left Circuit Logic -->
    <g transform="translate(130, 395)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
               fill="url(#qhHexFill)" stroke="url(#qhGoldMain)" stroke-width="6" stroke-linejoin="round" />
      <circle cx="-16" cy="-12" r="3" stroke="#f5cf58" stroke-width="2" fill="none" />
      <circle cx="-16" cy="12" r="3" stroke="#f5cf58" stroke-width="2" fill="none" />
      <line x1="-13" y1="-12" x2="0" y2="-12" stroke="#f5cf58" stroke-width="2" />
      <line x1="-13" y1="12" x2="-6" y2="12" stroke="#f5cf58" stroke-width="2" />
      <line x1="0" y1="-12" x2="6" y2="-4" stroke="#f5cf58" stroke-width="2" />
      <line x1="-6" y1="12" x2="6" y2="4" stroke="#f5cf58" stroke-width="2" />
      <rect x="6" y="-6" width="12" height="12" fill="#1b1a20" stroke="#f5cf58" stroke-width="1.5" />
      <circle cx="12" cy="0" r="2" fill="#f5cf58" />
      <line x1="18" y1="0" x2="22" y2="0" stroke="#f5cf58" stroke-width="2" />
    </g>

    <!-- Satellite 5: Top-Left CPU Chip -->
    <g transform="translate(85, 195)">
      <polygon points="0,-45 39,-22 39,22 0,45 -39,22 -39,-22"
               fill="url(#qhHexFill)" stroke="url(#qhGoldMain)" stroke-width="6" stroke-linejoin="round" />
      <rect x="-14" y="-14" width="28" height="28" fill="#1a1820" stroke="url(#qhGoldMain)" stroke-width="2.5" />
      <rect x="-6" y="-6" width="12" height="12" fill="url(#qhGoldMain)" />
      <line x1="-10" y1="-14" x2="-10" y2="-22" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="0" y1="-14" x2="0" y2="-22" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="10" y1="-14" x2="10" y2="-22" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="-10" y1="14" x2="-10" y2="22" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="0" y1="14" x2="0" y2="22" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="10" y1="14" x2="10" y2="22" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="-14" y1="-8" x2="-22" y2="-8" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="-14" y1="0" x2="-22" y2="0" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="-14" y1="8" x2="-22" y2="8" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="14" y1="-8" x2="22" y2="-8" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="14" y1="0" x2="22" y2="0" stroke="#f5cf58" stroke-width="1.5" />
      <line x1="14" y1="8" x2="22" y2="8" stroke="#f5cf58" stroke-width="1.5" />
    </g>
  </g>
</svg>
