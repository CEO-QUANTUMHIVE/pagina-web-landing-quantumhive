<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Investigación comercial — QuantumHive</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #020617;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #020617;
      }

      .shell {
        display: grid;
        grid-template-rows: 42px 1fr;
        width: 100%;
        height: 100%;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 16px;
        color: #cbd5e1;
        background: #0f172a;
        border-bottom: 1px solid #1e293b;
        font-size: 13px;
      }

      .bar strong { color: #f8fafc; }

      .bar a {
        color: #fbbf24;
        text-decoration: none;
        font-weight: 700;
      }

      .bar a:hover { color: #fde68a; }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #020617;
      }

      noscript {
        padding: 24px;
        color: #f8fafc;
      }

      @media (max-width: 640px) {
        .bar { padding: 0 10px; font-size: 11px; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="bar">
        <span><strong>QuantumHive</strong> · Investigación comercial</span>
        <a href="../">Volver a la landing</a>
      </header>
      <iframe
        src="https://inteligencia-scrap---perfilador-clientes-3eb2wgn6xa-ue.a.run.app/dashboard"
        title="Investigación comercial de QuantumHive"
        allow="clipboard-write"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
      <noscript>Necesitás activar JavaScript para usar Investigación comercial.</noscript>
    </main>
  </body>
</html>
